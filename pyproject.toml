[project]
name = "event-agent"
version = "0.1.0"
description = "MVP-сервис поиска анонсов событий: ddgs + LLM + SQLite"
readme = "README.md"
authors = [
    { name = "shorokhov_kd", email = "shorokhov_kd@farpost.com" }
]
requires-python = ">=3.12"
dependencies = [
    "ddgs>=9.16",
    "fastapi>=0.115",
    "litellm>=1.109",
    "pydantic>=2.14",
    "pyyaml>=6.0",
    "uvicorn>=0.30",
]

[project.scripts]
event-agent = "event_agent.main:main"

[build-system]
requires = ["uv_build>=0.11.31,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.14",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
